drone_id: drone2
mavros_namespace: /drone2/mavros
sector_index: 1

camera:
  enabled: true
  source: 0
  width: 1280
  height: 720
  hfov_deg: 90.0
  tilt_forward_deg: 0.0
  ref_point: center
  ground_elevation_rel_m: 0.0
  camera_matrix: null
  dist_coeffs: null
  calib_size: null

payload_release:
  hold_s: 1.5
  between_s: 0.5
  servos:
    - {channel: 9,  open_pwm: 1900, closed_pwm: 1100}
    - {channel: 10, open_pwm: 1900, closed_pwm: 1100}
    - {channel: 11, open_pwm: 1900, closed_pwm: 1100}
    - {channel: 12, open_pwm: 1900, closed_pwm: 1100}